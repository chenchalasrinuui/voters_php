<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Voters API — Swagger Interactive Testing</title>
  <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5/swagger-ui.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      background: #0b0f19;
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      color: #e2e8f0;
    }
    .cors-banner {
      background: linear-gradient(90deg, #1e1b4b 0%, #0f172a 100%);
      border-bottom: 1px solid #312e81;
      padding: 16px 24px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .cors-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #064e3b;
      color: #6ee7b7;
      padding: 4px 10px;
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 600;
      border: 1px solid #059669;
    }
    .cors-info {
      font-size: 13px;
      color: #cbd5e1;
    }
    .cors-test-btn {
      background: #4f46e5;
      color: #ffffff;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .cors-test-btn:hover {
      background: #4338ca;
    }
    #cors-result {
      margin: 10px 24px 0 24px;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 12px;
      font-family: monospace;
      display: none;
    }
    .swagger-ui {
      filter: invert(88%) hue-rotate(180deg);
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }
    .swagger-ui .topbar { display: none; }
  </style>
</head>
<body>
  <div class="cors-banner">
    <div>
      <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 4px;">
        <span style="font-size: 20px;">🗳️</span>
        <strong style="font-size: 16px; color: #fff;">Voters Management API &amp; Swagger Console</strong>
        <span class="cors-badge">✅ CORS Enabled (http://localhost:3000)</span>
      </div>
      <div class="cors-info">
        Ready for React App requests from <code>http://localhost:3000</code> to <code>http://localhost/voters_php/api/auth/login</code>
      </div>
    </div>
    <div>
      <button class="cors-test-btn" onclick="testCorsLogin()">⚡ Quick Test Auth Login (CORS)</button>
    </div>
  </div>

  <div id="cors-result"></div>

  <div id="swagger-ui"></div>

  <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
  <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-standalone-preset.js"></script>
  <script>
    window.onload = function() {
      window.ui = SwaggerUIBundle({
        url: './openapi.json',
        dom_id: '#swagger-ui',
        deepLinking: true,
        presets: [
          SwaggerUIBundle.presets.apis,
          SwaggerUIStandalonePreset
        ],
        layout: "BaseLayout"
      });
    };

    function testCorsLogin() {
      var resEl = document.getElementById('cors-result');
      resEl.style.display = 'block';
      resEl.style.background = '#1e293b';
      resEl.style.color = '#38bdf8';
      resEl.textContent = 'Sending POST request to /api/auth/login with credentials...';

      fetch('../api/auth/login', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Accept': 'application/json'
        },
        body: JSON.stringify({
          username: 'srikakulam_agent',
          password: 'password123'
        })
      })
      .then(function(res) {
        return res.json().then(function(data) {
          resEl.style.background = res.ok ? '#064e3b' : '#7f1d1d';
          resEl.style.color = res.ok ? '#6ee7b7' : '#fca5a5';
          resEl.textContent = 'HTTP ' + res.status + ' ' + res.statusText + ' — Response: ' + JSON.stringify(data);
        });
      })
      .catch(function(err) {
        resEl.style.background = '#7f1d1d';
        resEl.style.color = '#fca5a5';
        resEl.textContent = 'CORS / Network Error: ' + err.message;
      });
    }
  </script>
</body>
</html>
